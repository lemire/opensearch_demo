services:
  opensearch:
    image: opensearchproject/opensearch:2.19.7
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # Sécurité désactivée (usage local seulement) : pas besoin de mot de passe
      # administrateur (OPENSEARCH_INITIAL_ADMIN_PASSWORD) ni de HTTPS.
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - 9200:9200
    volumes:
      - osdata:/usr/share/opensearch/data
volumes:
  osdata:
